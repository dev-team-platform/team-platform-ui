<section class="component-section" aria-labelledby="input-autocomplete-multiselect-title">
  <div class="component-section__heading">
    <h2 id="input-autocomplete-multiselect-title">Input autocomplete multi select</h2>
    <code>&lt;tp-input-autocomplete-multiselect&gt;</code>
  </div>
  <div class="input-grid">
    <tp-input-autocomplete-multiselect
      title="abc"
      placeholder="Search projects"
      [options]="projectOptions()"
      [displayWith]="displayProject"
      [(value)]="selectedProjects"
      (onSearch)="searchProjects($event)"
      typingMode="inline"
      [maxChipContentLength]="14"
      [maxChips]="1"
      hint="Search is handled by the parent/API"
    ></tp-input-autocomplete-multiselect>
    <tp-input-autocomplete-multiselect
      title="Projects, typing on a new line"
      placeholder="Search projects"
      [options]="projectOptions()"
      [displayWith]="displayProject"
      [(value)]="selectedProjects"
      (onSearch)="searchProjects($event)"
      typingMode="newline"
      [maxChipContentLength]="14"
      [maxChips]="2"
    ></tp-input-autocomplete-multiselect>
    <tp-input-autocomplete-multiselect
      title="Loading projects"
      [loading]="true"
      loadingMessage="Fetching projects..."
    ></tp-input-autocomplete-multiselect>
    <tp-input-autocomplete-multiselect
      title="Required projects"
      placeholder="Search projects"
      [options]="projectOptions()"
      [displayWith]="displayProject"
      [required]="true"
      [maxChips]="2"
    ></tp-input-autocomplete-multiselect>
    <tp-input-autocomplete-multiselect
      title="Empty projects"
      noResultsMessage="No projects are available"
    ></tp-input-autocomplete-multiselect>
  </div>
  <p>
    Selected projects: <strong>{{ selectedProjectText() }}</strong>
  </p>
</section>
