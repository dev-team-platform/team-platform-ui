<section class="component-section" aria-labelledby="dividers-title">
  <div class="component-section__heading">
    <h2 id="dividers-title">Divider</h2>
    <code>&lt;tp-divider&gt;</code>
  </div>

  <div class="example-stack">
    <h3>Horizontal</h3>
    <p>Content above the divider</p>
    <tp-divider></tp-divider>
    <p>Content below the divider</p>
  </div>

  <div class="example-stack">
    <h3>Inset</h3>
    <tp-divider inset></tp-divider>
  </div>

  <div class="example-stack">
    <h3>Display modes</h3>
    <span>Line</span>
    <tp-divider mode="line"></tp-divider>
    <span>Dot</span>
    <tp-divider mode="dot"></tp-divider>
    <span>Dot-line</span>
    <tp-divider mode="dot-line"></tp-divider>
    <span>Dash</span>
    <tp-divider mode="dash"></tp-divider>
    <span>Double line</span>
    <tp-divider mode="double-line"></tp-divider>
    <span>Triple line</span>
    <tp-divider mode="triple-line"></tp-divider>
  </div>

  <div class="example-row divider-example--vertical">
    <span>Before</span>
    <tp-divider vertical></tp-divider>
    <span>After</span>
  </div>
</section>
