<mat-form-field
  class="tp-input-date-picker"
  [class.tp-input-date-picker--invalid]="showError()"
  [class.tp-input-date-picker--disabled]="disabled() || readonly()"
  appearance="outline"
  [hideRequiredMarker]="true"
  subscriptSizing="dynamic"
  [style.width]="width()"
  [style.max-width]="maxWidth()"
  [style.--tp-input-date-picker-height]="height()"
  [style.--tp-input-date-picker-max-height]="maxHeight()"
  [style.--tp-input-date-picker-focus-color]="focusColor()"
>
  @if (title()) {
    <mat-label>
      {{ title() }}
      @if (required()) {
        <span class="tp-input-date-picker__required-marker" aria-hidden="true">*</span>
      }
    </mat-label>
  }
  <input
    #dateInput="matDatepickerInput"
    matInput
    class="tp-input-date-picker__control"
    [matDatepicker]="picker"
    [ngModel]="value()"
    [ngModelOptions]="{ standalone: true }"
    [min]="minDate()"
    [max]="maxDate()"
    [placeholder]="placeholder()"
    [disabled]="disabled() || readonly()"
    [readonly]="true"
    [required]="required()"
    [attr.name]="name() || null"
    [attr.aria-invalid]="showError()"
    [attr.aria-describedby]="showError() ? errorId : null"
    (ngModelChange)="selectDate($event)"
    (blur)="markAsTouched()"
    (keydown)="clearOnKeydown($event)"
  />
  <mat-datepicker-toggle matIconSuffix [for]="picker" [disabled]="disabled() || readonly()">
    <span matDatepickerToggleIcon class="tp-icon material-symbols-outlined"> event </span>
  </mat-datepicker-toggle>
  <mat-datepicker
    #picker
    startView="month"
    [disabled]="disabled() || readonly()"
    [panelClass]="calendarPanelClass()"
    [startAt]="startAt()"
  ></mat-datepicker>
</mat-form-field>

@if (showError()) {
  <div [id]="errorId" class="tp-input-date-picker__error" role="alert">
    {{ displayedError() }}
  </div>
}
