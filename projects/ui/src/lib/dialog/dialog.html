@if (isOpen()) {
  <div
    class="tp-dialog-backdrop"
    (click)="handleBackdropClick($event)"
    (keydown.escape)="handleEscape($event)"
  >
    <section
      class="tp-dialog"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      [attr.aria-label]="ariaLabel()"
      [ngStyle]="dialogStyle()"
    >
      <ng-content></ng-content>
    </section>
  </div>
}
