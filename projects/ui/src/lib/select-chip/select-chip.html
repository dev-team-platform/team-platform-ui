<span
  class="tp-select-chip__content"
  [matTooltip]="tooltipTitle() || ''"
  [matTooltipDisabled]="!tooltipTitle()"
>
  <span class="tp-select-chip__label">{{ label() }}</span>
  @if (removable()) {
    <button
      type="button"
      class="tp-select-chip__remove"
      [attr.aria-label]="removeLabel() || 'Remove ' + label()"
      (click)="removeChip($event)"
    >
      <svg
        class="tp-select-chip__remove-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12Z"
        />
      </svg>
    </button>
  }
</span>
